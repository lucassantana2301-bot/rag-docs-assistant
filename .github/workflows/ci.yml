name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e avaliação (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0  # tags imutáveis a partir da v8
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing

      - name: Avaliação de qualidade (golden set)
        if: matrix.python == '3.13'
        run: |
          uv run rag --db /tmp/eval.db ingest corpus
          {
            echo '## Avaliação do RAG (golden set)'
            echo
            uv run rag --db /tmp/eval.db eval eval/golden.jsonl --answers --min-hit-rate 0.9
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker build e smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rag-docs-assistant .
      - name: Smoke test
        run: |
          docker run -d --name rag -p 8000:8000 rag-docs-assistant
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/api/ask \
            -H 'content-type: application/json' \
            -d '{"question": "Quantos dias de férias posso vender?"}' | tee /tmp/answer.json
          grep -q '"grounded":true' /tmp/answer.json
          docker logs rag | tail -5
