name: Release

# Disparado por tag SemVer (vX.Y.Z): valida, gera wheel/sdist, publica a imagem no GHCR com
# SBOM e proveniência e cria a release com as notas do CHANGELOG e os pacotes anexados.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  verify:
    name: Validação e pacotes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.15'
          enable-cache: true
      - run: uv sync --frozen

      - name: Tag bate com a versão do pacote
        run: |
          expected="v$(uv run python -c 'import rag_docs; print(rag_docs.__version__)')"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::tag $VERSION diferente da versão do pacote ($expected)"
            exit 1
          fi

      - name: CHANGELOG tem a seção da versão
        run: scripts/changelog-section.sh "${VERSION#v}" > /dev/null

      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

      - name: Gate de qualidade do RAG
        run: |
          uv run rag --db /tmp/eval.db ingest corpus
          uv run rag --db /tmp/eval.db eval eval/golden.jsonl --min-hit-rate 0.9

      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    name: Imagem Docker
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Cria a release com as notas do CHANGELOG
        run: |
          {
            scripts/changelog-section.sh "${VERSION#v}"
            echo
            echo "### Instalação"
            echo
            echo '```bash'
            echo "docker run -p 8000:8000 ghcr.io/${GITHUB_REPOSITORY}:${VERSION#v}"
            echo "uv tool install \"rag-docs-assistant @ https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/rag_docs_assistant-${VERSION#v}-py3-none-any.whl\""
            echo '```'
            echo
            echo "Relatório de avaliação: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } > notes.md
          gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
