name: Release

# Release automática: quando `__version__` muda na main e ainda não existe a release, valida,
# gera wheel/sdist, publica a imagem no GHCR com SBOM e proveniência e cria a tag e a release
# com as notas do CHANGELOG e os pacotes anexados. Também aceita tag vX.Y.Z enviada à mão.

on:
  push:
    branches: [main]
    paths: [src/rag_docs/__init__.py]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Versão a publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="v$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' src/rag_docs/__init__.py)"
          if [ "$version" = "v" ]; then echo "::error::__version__ não encontrado"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME diferente da versão do pacote ($version)"
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version já existe; nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Validação e pacotes
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.15'
          enable-cache: true
      - run: uv sync --frozen

      - name: CHANGELOG tem a seção da versão
        run: scripts/changelog-section.sh "${VERSION#v}" > /dev/null

      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

      - name: Gate de qualidade do RAG
        run: |
          uv run rag --db /tmp/eval.db ingest corpus
          uv run rag --db /tmp/eval.db eval eval/golden.jsonl --min-hit-rate 0.9

      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    name: Imagem Docker
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    needs: [prepare, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Cria a release com as notas do CHANGELOG
        run: |
          {
            scripts/changelog-section.sh "${VERSION#v}"
            echo
            echo "### Instalação"
            echo
            echo '```bash'
            echo "docker run -p 8000:8000 ghcr.io/${GITHUB_REPOSITORY}:${VERSION#v}"
            echo "uv tool install \"rag-docs-assistant @ https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/rag_docs_assistant-${VERSION#v}-py3-none-any.whl\""
            echo '```'
            echo
            echo "Relatório de avaliação: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } > notes.md
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
